<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fix: aria-hidden on decorative emoji – EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { font-family: sans-serif; padding: 2rem; background: #f5f5f5; }
    .callout { background: #eef2ff; border-left: 4px solid #6366f1; padding: 1rem; border-radius: 8px; max-width: 500px; }
  </style>
</head>
<body>
  <h1>Fix #2769: aria-hidden on Decorative Emoji</h1>
  <p>The lightbulb emoji below is now hidden from screen readers using <code>aria-hidden="true"</code>:</p>

  <div class="callout">
    <span class="docs-info-icon" aria-hidden="true">💡</span>
    Electric light bulb — EaseMotion CSS bridges the gap between design and development.
  </div>
</body>
</html>
